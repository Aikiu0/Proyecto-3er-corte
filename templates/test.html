{% extends "base.html" %}
{% block titulo %}Prueba de mecanografía{% endblock %}
{% block contenido %}

<div class="ventana-terminal animar-entrada">
    <div class="barra-terminal">
        <div class="puntos">
            <span class="punto rojo"></span>
            <span class="punto amarillo"></span>
            <span class="punto verde"></span>
        </div>
        <span class="nombre-archivo">{{ titulo }}</span>
        <div id="racha" class="racha">
            <span class="icono-racha">🔥</span>
            <span id="racha-numero">0</span>
        </div>
        <span id="tiempo" class="tiempo"><span id="tiempo-restante" class="numero-tiempo">60</span>s</span>
    </div>

    <div class="cuerpo-terminal">
        <p id="texto-prueba" class="texto-prueba"></p>
    </div>

    <div class="barra-progreso-contenedor">
        <div id="barra-progreso" class="barra-progreso"></div>
    </div>
</div>

<input type="text" id="entrada-usuario" class="entrada-usuario" autocomplete="off" autocorrect="off"
       spellcheck="false" placeholder="Empieza a escribir aquí y presiona espacio para pasar de palabra...">

<div id="pantalla-resultado" class="pantalla-resultado">
    <div class="tarjeta-resultado">
        <p class="eyebrow">resultado</p>
        <p class="etiqueta-resultado">Palabras por minuto</p>
        <p id="valor-wpm" class="valor-resultado">0</p>

        <img id="imagen-resultado" class="imagen-resultado" src="" alt="">
        <p id="nivel-resultado" class="nivel-resultado"></p>
        <p id="frase-resultado" class="frase-resultado"></p>

        <div class="acciones-resultado">
            <a href="{{ url_for('menu') }}" class="boton boton-secundario">Volver al menú</a>
            <a href="{{ request.full_path }}" class="boton boton-principal">Repetir prueba</a>
        </div>
    </div>
</div>

<script id="texto-datos" type="application/json">{{ oraciones | tojson }}</script>
<script id="niveles-datos" type="application/json">{{ niveles | tojson }}</script>
<script src="{{ url_for('static', filename='js/test.js') }}"></script>

{% endblock %}
